<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Standalone AltEditorLite example</title>
    <link rel="stylesheet" href="/dist/umd/alt-editor-lite.css" />
    <link rel="stylesheet" href="./standalone.css" />
  </head>
  <body>
    <main>
      <h1>Standalone record editor</h1>
      <p>
        This example keeps one record in application state and connects it to the editor
        without a table or grid library.
      </p>

      <section class="record-card" aria-labelledby="record-heading">
        <h2 id="record-heading">Current record</h2>
        <p id="empty-record">No record has been created.</p>
        <dl id="record-values" hidden>
          <div>
            <dt>Name</dt>
            <dd id="record-name"></dd>
          </div>
          <div>
            <dt>Email</dt>
            <dd id="record-email"></dd>
          </div>
        </dl>
      </section>

      <div class="actions" aria-label="Record actions">
        <button id="create-record" type="button">Create</button>
        <button id="edit-record" type="button">Edit</button>
        <button id="remove-record" type="button">Remove</button>
      </div>
      <p id="operation-status" role="status" aria-live="polite"></p>
    </main>

    <script src="/dist/umd/datatables-alteditor-lite-standalone.js"></script>
    <script src="./standalone.js"></script>
  </body>
</html>
