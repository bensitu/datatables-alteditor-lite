<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net/npm/@visactor/vtable@1.26.9/dist/vtable.min.js; style-src 'self' 'sha256-Jm/0aMeoqmtuGdflFYoXNmqNpH5UC6Qu5B+eplftGq0=' 'sha256-8M4bAgCPtxB+j9LVG16uTZjywB5B/kOi/IMeABxKwoU=' 'sha256-vmUKEzeaI5ArhZey5s/iNY2wDy9QFOVmpe9sBJH8dZI=' 'sha256-KaOqwB48dv+oXUMDJ75n61s1MWrYOimLGjkhQirYGzE=' 'sha256-Fjjfj6jP8vIFUC2t7Rtb3bbbmVX5XKa3yiJClkgSKdg='; style-src-attr 'unsafe-hashes' 'sha256-3oFxofzq3N//6J8H86e9ul4WT2OkJrtonB66gn/TLJw='; font-src 'self' data:; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'none'"
    />
    <title>VTable ListTable · AltEditorLite</title>
    <link rel="icon" href="../favicon.ico" />

    <link rel="stylesheet" href="../../../dist/umd/alt-editor-lite.css" />
    <link rel="stylesheet" href="../demo.css" />
    <link rel="stylesheet" href="../reference.css" />
    <link rel="stylesheet" href="./sales.css" />
  </head>
  <body>
    <header class="demo-topbar">
      <a class="demo-brand" href="../">AltEditorLite</a>
      <a href="../reference.html#tables">Table integrations</a>
    </header>
    <main class="reference-page sales-example">
      <header class="reference-heading">
        <h1>VTable ListTable</h1>
        <p>
          Double-click a data cell or choose a region to edit its sales. Column headers
          sort the records.
        </p>
      </header>
      <section aria-labelledby="sales-title">
        <h2 id="sales-title">Regional sales</h2>
        <div class="reference-actions">
          <label for="region">Region</label
          ><select id="region"></select
          ><button type="button" id="edit">Edit region</button>
        </div>
        <div
          id="sales"
          class="sales-grid"
          role="img"
          aria-label="Regional sales table"
        ></div>
        <label class="reference-choice"
          ><input type="checkbox" id="fail-save" /> Simulate a failure on the next
          save</label
        >
        <h3 class="reference-result-title">Saved records</h3>
        <output aria-label="Saved records"></output>
        <p role="status"></p>
      </section>
    </main>
    <script
      src="https://cdn.jsdelivr.net/npm/@visactor/vtable@1.26.9/dist/vtable.min.js"
      integrity="sha384-NOSdlxYVMQYK8DtpzYBRdDZPHZgvmL5GDVO5dvIX+lzf684lpw8zEW4rwJmTqnG3"
      crossorigin="anonymous"
    ></script>
    <script type="module" src="./vtable.js"></script>
  </body>
</html>
