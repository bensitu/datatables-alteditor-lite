<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net/npm/plotly.js-strict-dist-min@4.3.1/plotly-strict.min.js; style-src 'self' 'sha256-47DEQpj8HBSa+/TImW+5JCeuQeRkm5NMpJWZG3hSuFU=' 'sha256-qQeYoZUwF3kOWQ9+G9Nf8QOopCY5cstHKQt4rfhvjCA='; font-src 'self' data:; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'"
    />
    <title>Plotly Table · AltEditorLite</title>
    <link rel="icon" href="../favicon.ico" />

    <link rel="stylesheet" href="../../../dist/umd/alt-editor-lite.css" />
    <link rel="stylesheet" href="../demo.css" />
    <link rel="stylesheet" href="../reference.css" />
    <link rel="stylesheet" href="./sales.css" />
  </head>
  <body>
    <header class="demo-topbar">
      <a class="demo-brand" href="../">AltEditorLite</a>
      <a href="../reference.html#tables">Table integrations</a>
    </header>
    <main class="reference-page sales-example">
      <header class="reference-heading">
        <h1>Plotly Table</h1>
        <p>
          Edit a region to update the sales table, its total, and the bar chart from the
          same records.
        </p>
      </header>
      <section aria-labelledby="sales-title">
        <h2 id="sales-title">Regional sales</h2>
        <div class="reference-actions">
          <label for="region">Region</label
          ><select id="region"></select
          ><button type="button" id="edit">Edit region</button>
        </div>
        <div
          id="sales"
          class="sales-figure"
          role="img"
          aria-label="Sales table and bar chart by region"
        ></div>
        <label class="reference-choice"
          ><input type="checkbox" id="fail-save" /> Simulate a failure on the next
          save</label
        >
        <h3 class="reference-result-title">Saved records</h3>
        <output aria-label="Saved records"></output>
        <p role="status"></p>
      </section>
    </main>
    <script
      src="https://cdn.jsdelivr.net/npm/plotly.js-strict-dist-min@4.3.1/plotly-strict.min.js"
      integrity="sha384-DZjWjU81VZPs+GNs3ew8ITUBFjlLs+Jro+6YubdlCU6jyi/en9x0gdwFuZz1vyqR"
      crossorigin="anonymous"
    ></script>
    <script type="module" src="./plotly.js"></script>
  </body>
</html>
