version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '04:00'
      timezone: 'Asia/Tokyo'
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - '*'
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '04:30'
      timezone: 'Asia/Tokyo'
    open-pull-requests-limit: 10
    ignore:
      # TypeScript 7 is outside the current typescript-eslint peer range.
      - dependency-name: 'typescript'
        versions:
          - '>=7.0.0'
      # Check against the types for the lowest supported Node.js major.
      - dependency-name: '@types/node'
        versions:
          - '>=23.0.0'
    groups:
      vitest:
        patterns:
          - 'vitest'
          - '@vitest/coverage-v8'
      commitlint:
        patterns:
          - '@commitlint/cli'
          - '@commitlint/config-conventional'
      stylelint:
        patterns:
          - 'stylelint'
          - 'stylelint-config-standard'
      npm-development-minor-and-patch:
        dependency-type: 'development'
        update-types:
          - 'minor'
          - 'patch'
      npm-production-minor-and-patch:
        dependency-type: 'production'
        update-types:
          - 'minor'
          - 'patch'
